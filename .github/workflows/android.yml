name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Add Capacitor Android & Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init CreatorBoost com.creatorboost.app --web-dir dist || npx cap init CreatorBoost com.creatorboost.app --web-dir build
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorBoost-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
